name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --bundles dmg
          - platform: macos-15-intel
            args: --bundles dmg
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Prepare bundled sing-box
        run: pnpm run prepare:sing-box
      - name: Prepare Apple signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.APPLE_CERTIFICATE }}" ] || \
             [ -z "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" ] || \
             [ -z "${{ secrets.KEYCHAIN_PASSWORD }}" ] || \
             [ -z "${{ secrets.APPLE_TEAM_ID }}" ] || \
             [ -z "${{ secrets.APPLE_API_KEY_ID }}" ] || \
             [ -z "${{ secrets.APPLE_API_ISSUER }}" ] || \
             [ -z "${{ secrets.APPLE_API_PRIVATE_KEY }}" ]; then
            echo "Apple signing secrets are incomplete; building unsigned macOS artifacts."
            echo "APPLE_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/goyou-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/goyou-build.keychain-db"
          printf '%s' "${{ secrets.APPLE_CERTIFICATE }}" | (base64 --decode 2>/dev/null || base64 -D) > "$CERT_PATH"
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found." >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2
            exit 1
          fi

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          printf '%s' "${{ secrets.APPLE_API_PRIVATE_KEY }}" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          {
            echo "APPLE_SIGNING_ENABLED=true"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY_ID }}"
            echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}"
            echo "APPLE_API_KEY_PATH=$API_KEY_PATH"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"
      - name: Sign bundled macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${APPLE_SIGNING_ENABLED:-false}" != "true" ]; then
            echo "Apple signing is disabled; skipping bundled binary signing."
            exit 0
          fi
          SING_BOX_PATH="src-tauri/resources/sing-box/sing-box"
          test -x "$SING_BOX_PATH"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$SING_BOX_PATH"
          codesign --verify --strict --verbose=2 "$SING_BOX_PATH"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ env.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GoYou ${{ github.ref_name }}
          releaseBody: Automated desktop build.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
