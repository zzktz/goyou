services:
  relay:
    build: ./metering
    container_name: goyou-relay
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      MANAGEMENT_API_URL: ${MANAGEMENT_API_URL}
      RELAY_ID: ${RELAY_ID:-default}
      RELAY_TOKEN: ${RELAY_TOKEN:-}
      METERING_TOKEN: ${METERING_TOKEN}
      RELAY_CONFIG_PATH: /var/lib/goyou/relay.json
      METERING_STATE_PATH: /var/lib/goyou/metering-state.json
      EGRESS_HOST: ${EGRESS_HOST:-127.0.0.1}
      EGRESS_PORT: ${EGRESS_PORT:-19080}
      RELAY_METHOD: ${RELAY_METHOD:-chacha20-ietf-poly1305}
    volumes:
      - ./data:/var/lib/goyou
    cap_drop:
      - ALL
